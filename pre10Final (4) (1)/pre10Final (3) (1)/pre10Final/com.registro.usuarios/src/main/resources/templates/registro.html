<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="icon" href="https://i.ibb.co/WNVMdWcm/Whats-App-Image-2025-10-27-at-2-50-55-PM.jpg" type="image/jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0056b3 0%, #007bff 50%, #5bc0de 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* Partículas */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Contenedor principal */
        .page-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card unificado */
        .reg-card {
            display: flex;
            width: 100%;
            max-width: 780px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Panel izquierdo */
        .reg-left {
            width: 38%;
            flex-shrink: 0;
            background: linear-gradient(160deg, #1a6fcc 0%, #0e4fa0 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 2.5rem 1.75rem;
            text-align: center;
        }

        .reg-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reg-left h2 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.3;
        }

        .reg-left p {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
            line-height: 1.6;
        }

        /* Panel derecho */
        .reg-right {
            flex: 1;
            background: rgba(255, 255, 255, 0.97);
            padding: 2rem 2rem 1.75rem;
            display: flex;
            flex-direction: column;
        }

        .form-title {
            font-weight: 700;
            font-size: 1.55rem;
            color: #333;
            margin-bottom: 1.25rem;
            padding-bottom: 14px;
            text-align: center;
            position: relative;
        }

        .form-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 3px;
            background: linear-gradient(to right, #007bff, #5bc0de);
            border-radius: 4px;
        }

        /* Fila doble */
        .field-row {
            display: flex;
            gap: 12px;
        }

        .field-row .mb-3 {
            flex: 1;
        }

        /* Campos */
        .form-label {
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            font-size: 0.88rem;
        }

        .input-group-text {
            background-color: #f4f6f9;
            border: 1px solid #dde2ea;
            border-right: none;
            color: #6c757d;
        }

        .form-control {
            border: 1px solid #dde2ea;
            border-left: none;
            padding: 9px 12px;
            font-size: 0.9rem;
            background-color: #f4f6f9;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.15);
            border-color: #007bff;
            background-color: #fff;
        }

        .form-control:focus~.input-group-text,
        .input-group:focus-within .input-group-text {
            border-color: #007bff;
            background-color: #e7f1ff;
        }

        /* Botones */
        .btn-back {
            border-radius: 30px;
            padding: 9px 22px;
            font-weight: 600;
            font-size: 0.9rem;
            background: #f0f0f0;
            border: 1px solid #ccc;
            color: #555;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back:hover {
            background: #e0e0e0;
            color: #333;
            transform: translateY(-1px);
        }

        .btn-primary {
            border-radius: 30px;
            padding: 9px 0;
            font-weight: 600;
            font-size: 0.9rem;
            background: linear-gradient(to right, #007bff, #0056b3);
            border: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(0, 123, 255, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(to right, #0056b3, #004085);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 123, 255, 0.4);
        }

        .btn-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }

        /* Modal */
        .modal-content {
            border-radius: 14px;
            border: none;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
        }

        .modal-header {
            background: linear-gradient(to right, #007bff, #5bc0de);
            color: white;
            border-radius: 14px 14px 0 0;
            border: none;
        }

        .modal-title {
            font-weight: 600;
        }

        .list-group-item {
            border: none;
            padding: 10px 14px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9rem;
        }

        .list-group-item:last-child {
            border-bottom: none;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .reg-card {
                flex-direction: column;
            }

            .reg-left {
                width: 100%;
                padding: 1.75rem 1.5rem;
                border-radius: 0;
                gap: 12px;
            }

            .reg-left h2 {
                font-size: 1.2rem;
            }

            .reg-right {
                padding: 1.5rem 1.25rem;
            }

            .field-row {
                flex-direction: column;
                gap: 0;
            }

            .btn-area {
                flex-direction: column;
            }

            .btn-area a,
            .btn-area button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="particles" id="particles"></div>

    <!-- Modal de Confirmación -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalLabel">Confirmación de Registro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-3">¿Estás seguro de que estos son tus datos?</p>
                    <ul class="list-group">
                        <li class="list-group-item"><strong>Nombre:</strong> <span id="previewNombre"></span></li>
                        <li class="list-group-item"><strong>Apellido:</strong> <span id="previewApellido"></span></li>
                        <li class="list-group-item"><strong>Edad:</strong> <span id="previewEdad"></span></li>
                        <li class="list-group-item"><strong>Celular:</strong> <span id="previewCelular"></span></li>
                        <li class="list-group-item"><strong>Email:</strong> <span id="previewEmail"></span></li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="confirmSubmit" class="btn btn-primary">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Card principal -->
    <div class="page-wrapper">
        <div class="reg-card">

            <!-- Panel izquierdo -->
            <div class="reg-left">
                <div class="reg-avatar">
                    <img src="https://i.ibb.co/WNVMdWcm/Whats-App-Image-2025-10-27-at-2-50-55-PM.jpg"
                        alt="Logo Nutri Vida">
                </div>
                <h2>Únete a Nutri Vida</h2>
                <p>Crea tu cuenta para acceder a las herramientas de gestión de salud y nutrición.</p>
            </div>

            <!-- Panel derecho: formulario -->
            <div class="reg-right">
                <h3 class="form-title">Registro</h3>

                <form th:action="@{/registro}" method="post" th:object="${usuario}">

                    <!-- Nombre y Apellido en la misma fila -->
                    <div class="field-row">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input id="nombre" type="text" class="form-control" th:field="*{nombre}" required
                                    autofocus placeholder="Tu nombre">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="apellido" class="form-label">Apellido:</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input id="apellido" type="text" class="form-control" th:field="*{apellido}" required
                                    placeholder="Tu apellido">
                            </div>
                        </div>
                    </div>

                    <!-- Edad y Celular en la misma fila -->
                    <div class="field-row">
                        <div class="mb-3">
                            <label for="edad" class="form-label">Edad:</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                                <input id="edad" type="number" class="form-control" th:field="*{edad}" max="120" min="1"
                                    required placeholder="Tu edad">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="celular" class="form-label">Celular:</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input id="celular" type="text" class="form-control" th:field="*{celular}" required
                                    placeholder="3001234567">
                            </div>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input id="email" type="email" class="form-control" th:field="*{email}" required
                                placeholder="ejemplo@gmail.com">
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña:</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" class="form-control" th:field="*{password}" required
                                placeholder="Crea una contraseña segura">
                        </div>
                    </div>

                    <!-- Botones -->
                    <div class="btn-area">
                        <a href="/login" class="btn-back">
                            <i class="bi bi-arrow-left"></i> Volver
                        </a>
                        <button type="submit" class="btn btn-primary flex-grow-1" id="submitBtn">
                            <span id="btnText">Registrar</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"
                                aria-hidden="true"></span>
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 28; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 5 + 2;
                p.style.cssText = `
                left: ${Math.random() * 100}%;
                width: ${size}px;
                height: ${size}px;
                animation-delay: ${Math.random() * 15}s;
                animation-duration: ${Math.random() * 10 + 10}s;
            `;
                container.appendChild(p);
            }
        }

        $(document).ready(function () {
            createParticles();

            $('#celular').on('input', function () {
                this.value = this.value.replace(/\D/g, '').slice(0, 10);
            });

            $('#edad').on('focus', function () {
                if (this.value === '0') this.value = '';
            });

            const form = $('form');
            const modal = new bootstrap.Modal(document.getElementById('confirmModal'));

            $('#submitBtn').on('click', function (e) {
                e.preventDefault();

                const email = $('#email').val();
                if (!email.endsWith('@gmail.com')) {
                    alert('El correo electrónico debe ser de dominio @gmail.com');
                    return;
                }

                $('#previewNombre').text($('#nombre').val());
                $('#previewApellido').text($('#apellido').val());
                $('#previewEdad').text($('#edad').val());
                $('#previewCelular').text($('#celular').val());
                $('#previewEmail').text($('#email').val());

                modal.show();
            });

            $('#confirmSubmit').on('click', function () {
                $('#btnText').addClass('d-none');
                $('#btnSpinner').removeClass('d-none');
                modal.hide();
                form.off('submit');
                form.submit();
            });
        });
    </script>

</body>

</html>
