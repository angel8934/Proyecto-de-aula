<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas</title>
    <link rel="icon" href="https://i.ibb.co/WNVMdWcm/Whats-App-Image-2025-10-27-at-2-50-55-PM.jpg" type="image/jpeg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --primary-dark: #0056b3;
            --primary-light: #e3f2fd;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --text-dark: #333;
            --text-light: #6c757d;
            --border-radius: 12px;
            --box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s ease;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #e3f2fd 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            width: 95%;
            max-width: 1200px;
            margin: 0 auto;
            padding: clamp(15px, 3vw, 30px);
        }
        
        .header {
            text-align: center;
            margin-bottom: clamp(25px, 4vw, 40px);
            padding: clamp(20px, 4vw, 30px) 0;
        }
        
        .header h1 {
            color: var(--primary-dark);
            font-weight: 600;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: var(--text-light);
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            margin: 0;
            font-weight: 300;
        }
        
        .citas-container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            margin-bottom: 30px;
            width: 100%;
        }
        
        .table-responsive {
            overflow-x: auto;
            border-radius: var(--border-radius);
        }
        
        .citas-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        .citas-table thead {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
        }
        
        .citas-table th {
            color: white;
            font-weight: 600;
            padding: clamp(12px, 2.5vw, 16px);
            text-align: left;
            font-size: clamp(0.85rem, 2.5vw, 0.95rem);
            border: none;
        }
        
        .citas-table th:first-child {
            border-top-left-radius: var(--border-radius);
        }
        
        .citas-table th:last-child {
            border-top-right-radius: var(--border-radius);
        }
        
        .citas-table td {
            padding: clamp(12px, 2.5vw, 16px);
            border-bottom: 1px solid #e9ecef;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem);
            color: var(--text-dark);
        }
        
        .citas-table tbody tr {
            transition: var(--transition);
        }
        
        .citas-table tbody tr:hover {
            background-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.1);
        }
        
        .citas-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .empty-state {
            text-align: center;
            padding: clamp(40px, 8vw, 60px) 20px;
            color: var(--text-light);
        }
        
        .empty-state i {
            font-size: clamp(3rem, 10vw, 4rem);
            color: #dee2e6;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            color: var(--text-light);
            font-weight: 500;
            margin-bottom: 10px;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
        }
        
        .empty-state p {
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            margin-bottom: 25px;
        }
        
        .actions-container {
            display: flex;
            justify-content: center;
            gap: clamp(15px, 3vw, 25px);
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: clamp(10px, 2.5vw, 12px) clamp(20px, 3vw, 25px);
            border: none;
            border-radius: 8px;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
            font-size: clamp(0.85rem, 2.5vw, 0.95rem);
            cursor: pointer;
            min-width: 140px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
            color: white;
            text-decoration: none;
        }
        
        .btn-outline {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }
        
        .btn-outline:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            text-decoration: none;
        }
        
        .btn i {
            margin-right: 8px;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-confirmed {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(40, 167, 69, 0.2);
        }
        
        .status-pending {
            background-color: rgba(255, 193, 7, 0.1);
            color: var(--warning-color);
            border: 1px solid rgba(255, 193, 7, 0.2);
        }
        
        /* Ajustes para móviles */
        @media (max-width: 768px) {
            .container {
                padding: 15px 10px;
            }
            
            .citas-container {
                margin-bottom: 20px;
            }
            
            .actions-container {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 280px;
            }
            
            .citas-table th,
            .citas-table td {
                padding: 10px 8px;
            }
            
            .empty-state {
                padding: 30px 15px;
            }
        }
        
        /* Ajustes para tablets */
        @media (min-width: 769px) and (max-width: 1024px) {
            .container {
                width: 90%;
            }
        }
        
        /* Scroll personalizado */
        .table-responsive::-webkit-scrollbar {
            height: 8px;
        }
        
        .table-responsive::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .table-responsive::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 10px;
        }
        
        /* Animación de entrada */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .citas-table tbody tr {
            animation: fadeInUp 0.5s ease forwards;
        }
        
        .citas-table tbody tr:nth-child(1) { animation-delay: 0.1s; }
        .citas-table tbody tr:nth-child(2) { animation-delay: 0.2s; }
        .citas-table tbody tr:nth-child(3) { animation-delay: 0.3s; }
        .citas-table tbody tr:nth-child(4) { animation-delay: 0.4s; }
        .citas-table tbody tr:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mis Citas</h1>
            <p>Gestiona y revisa todas tus citas médicas programadas</p>
        </div>

        <!-- Mensaje de éxito -->
        <div th:if="${exito}" style="background-color: rgba(40, 167, 69, 0.1); color: #28a745; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; border-left: 4px solid #28a745; font-size: 0.9rem; max-width: 600px; margin-left: auto; margin-right: auto;">
            <i class="bi bi-check-circle"></i> <span th:text="${exito}"></span>
        </div>
        
        <div class="citas-container">
            <div class="table-responsive">
                <table class="citas-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha y Hora</th>
                            <th>Lugar</th>
                            <th>Médico</th>
                            <th>Email</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cita : ${citas}">
                            <td th:text="${cita.id}"></td>
                            <td th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${cita.lugar}"></td>
                            <td th:text="${cita.medico}"></td>
                            <td th:text="${cita.email}"></td>
                            <td>
                                <span class="status-badge status-confirmed">
                                    <i class="bi bi-check-circle"></i> Confirmada
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(citas)}">
                            <td colspan="6">
                                <div class="empty-state">
                                    <i class="bi bi-calendar-x"></i>
                                    <h3>No tienes citas reservadas</h3>
                                    <p>Parece que aún no has agendado ninguna cita médica.</p>
                                    <a href="/citas/apartado" class="btn btn-primary">
                                        <i class="bi bi-plus-circle"></i> Agendar Primera Cita
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="actions-container" th:if="${not #lists.isEmpty(citas)}">
            <a href="/citas/apartado" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Nueva Cita
            </a>
            <a href="/index" class="btn btn-outline">
                <i class="bi bi-arrow-left"></i> Volver al Inicio
            </a>
        </div>
        
        <div class="actions-container" th:if="${#lists.isEmpty(citas)}">
            <a href="/index" class="btn btn-outline">
                <i class="bi bi-arrow-left"></i> Volver al Inicio
            </a>
        </div>
    </div>

    <script>
        // Animación para las filas de la tabla
        document.addEventListener('DOMContentLoaded', function() {
            const rows = document.querySelectorAll('.citas-table tbody tr');
            rows.forEach((row, index) => {
                row.style.animationDelay = `${(index + 1) * 0.1}s`;
            });
        });
        
        // Ajustar el contenedor según la altura de la pantalla
        function adjustContainerHeight() {
            const container = document.querySelector('.container');
            const header = document.querySelector('.header');
            const tableContainer = document.querySelector('.citas-container');
            const actions = document.querySelector('.actions-container');
            
            const totalHeight = header.offsetHeight + tableContainer.offsetHeight + 
                              (actions ? actions.offsetHeight : 0) + 100;
            
            if (totalHeight > window.innerHeight) {
                container.style.paddingTop = '20px';
                container.style.paddingBottom = '20px';
            } else {
                container.style.paddingTop = 'clamp(15px, 3vw, 30px)';
                container.style.paddingBottom = 'clamp(15px, 3vw, 30px)';
            }
        }
        
        window.addEventListener('load', adjustContainerHeight);
        window.addEventListener('resize', adjustContainerHeight);
    </script>
</body>
</html>
