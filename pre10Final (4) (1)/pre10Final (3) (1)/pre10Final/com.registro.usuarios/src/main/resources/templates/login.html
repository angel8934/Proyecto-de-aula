<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Inicio de sesión</title>
    <link rel="icon" href="https://i.ibb.co/WNVMdWcm/Whats-App-Image-2025-10-27-at-2-50-55-PM.jpg" type="image/jpeg">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0056b3 0%, #007bff 50%, #5bc0de 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Capa oscura semitransparente para mejorar legibilidad */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .login-container {  
            display: flex;
            width: 90%;
            max-width: 1000px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .login-container:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .login-image {
            flex: 1;
            min-width: 400px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.85) 0%, rgba(0, 242, 254, 0.85) 100%);
        }

        .login-image-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .login-image-content img {
            width: 80%;
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            object-fit: cover;
            height: auto;
        }

        .login-image-content h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .login-image-content p {
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 90%;
            margin: 0 auto;
            opacity: 0.9;
        }

        .login-form {
            flex: 1;
            min-width: 400px;
            padding: 50px 40px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 25px;
        }

        .login-header img {
            width: 50px;
            margin-right: 15px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .login-header h3 {
            margin: 0;
            font-weight: 700;
            color: #333;
            font-size: 1.8rem;
        }

        .login-form h4 {
            margin-bottom: 30px;
            font-weight: 700;
            color: #333;
            position: relative;
            padding-bottom: 15px;
            font-size: 1.5rem;
        }

        .login-form h4::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, #007bff, #5bc0de);
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 1rem;
        }

        .form-group input {
            border: none;
            border-bottom: 2px solid #ddd;
            border-radius: 0;
            padding: 12px 0;
            margin-bottom: 5px;
            width: 100%;
            background: transparent;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .form-group input:focus {
            box-shadow: none;
            border-bottom: 2px solid #007bff;
            padding-left: 10px;
        }

        .form-group i {
            position: absolute;
            right: 10px;
            top: 42px;
            color: #aaa;
            transition: color 0.3s ease;
        }

        .form-group input:focus + i {
            color: #007bff;
        }

        .alert {
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border-left: 4px solid #dc3545;
        }

        .alert-info {
            background-color: rgba(23, 162, 184, 0.1);
            color: #17a2b8;
            border-left: 4px solid #17a2b8;
        }

        /* -------- BOTONES -------- */
        .btn-custom {
            border-radius: 30px;
            padding: 14px 0;
            font-size: 1rem;
            font-weight: 600;
            width: 48%;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-ingresar {
            background: linear-gradient(to right, #007bff, #0056b3);
            color: #fff;
        }

        .btn-ingresar:hover {
            background: linear-gradient(to right, #0056b3, #004085);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.4);
        }

        .btn-registrarse {
            background: linear-gradient(to right, #5bc0de, #138496);
            color: #fff;
        }

        .btn-registrarse:hover {
            background: linear-gradient(to right, #138496, #0c5460);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(91, 192, 222, 0.4);
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 10px;
        }

        .additional-options {
            margin-top: 30px;
            text-align: center;
            font-size: 0.95rem;
            color: #666;
        }

        .additional-options a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 500;
        }

        .additional-options a:hover {
            color: #0056b3;
            text-decoration: underline;
        }

        /* Efecto de partículas decorativas */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 992px) {
            .login-container {
                flex-direction: column;
                max-width: 600px;
            }

            .login-image, .login-form {
                min-width: 100%;
            }

            .login-image {
                padding: 40px 30px;
            }

            .login-form {
                padding: 40px 30px;
            }
        }

        @media (max-width: 576px) {
            .login-container {
                width: 95%;
            }

            .login-form {
                padding: 30px 20px;
            }

            .login-image {
                padding: 30px 20px;
            }

            .btn-container {
                flex-direction: column;
            }

            .btn-custom {
                width: 100%;
                margin-bottom: 10px;
            }

            .login-header h3 {
                font-size: 1.5rem;
            }

            .login-form h4 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

    <!-- Partículas decorativas -->
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="login-image">
            <div class="login-image-content">
                <img src="https://i.ibb.co/WNVMdWcm/Whats-App-Image-2025-10-27-at-2-50-55-PM.jpg" alt="Logo Nutri Vida" style="width: 140px; max-width: 140px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.3);">
                <h2>Nutri Vida</h2>
                <p style="font-size: 1rem;">Pequeños cambios, Grandes resultados</p>
                <p style="margin-top: 15px; font-size: 0.9rem; opacity: 0.8;">Gestión integral de salud y nutrición</p>
            </div>
        </div>

        <div class="login-form">
            <div class="login-header">
                <img src="https://i.ibb.co/WNVMdWcm/Whats-App-Image-2025-10-27-at-2-50-55-PM.jpg" alt="Logo" style="border-radius: 50%;">
                <h3>BIENVENIDO</h3>
            </div>

            <h4>INICIO DE SESIÓN</h4>

            <form th:action="@{/login}" method="post" id="login-form">

                <div th:if="${param.error}">
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>Usuario o contraseña inválidos
                    </div>
                </div>

                <div th:if="${param.logout}">
                    <div class="alert alert-info">
                        <i class="fas fa-check-circle me-2"></i>Ha cerrado sesión exitosamente
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Nombre de usuario:</label>
                    <input id="username" name="username" type="text" class="form-control" required autofocus placeholder="Digite su email ID">
                    <i class="fas fa-user"></i>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input id="password" name="password" type="password" class="form-control" required placeholder="Digite su contraseña">
                    <i class="fas fa-lock"></i>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn btn-custom btn-ingresar">
                        <i class="fas fa-sign-in-alt me-2"></i>INGRESAR
                    </button>
                    <button type="button" class="btn btn-custom btn-registrarse" id="btn-registrarse">
                        <i class="fas fa-user-plus me-2"></i>REGISTRAR
                    </button>
                </div>

                <div class="additional-options">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Crear partículas decorativas
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Posición aleatoria
                const left = Math.random() * 100;
                const size = Math.random() * 6 + 2;
                const delay = Math.random() * 15;
                const duration = Math.random() * 10 + 10;
                
                particle.style.left = `${left}%`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Validación del formulario
        document.getElementById('login-form').addEventListener('submit', function(event) {
            const usuario = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (usuario === "" || password === "") {
                alert("Por favor, complete todos los campos.");
                event.preventDefault();
            }
        });

        document.getElementById('btn-registrarse').addEventListener('click', function() {
            window.location.href = '/registro';
        });
        
        // Inicializar partículas cuando se carga la página
        window.addEventListener('DOMContentLoaded', createParticles);
    </script>

</body>
</html>
