
# ==========================================
# NUTRI VIDA - CONFIGURACION GENERAL
# ==========================================

spring.application.name=registro-usuarios-spring-security

# En el computador se utiliza el perfil local.
# Railway utilizara el perfil prod mediante
# SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local


# ==========================================
# SERVIDOR
# ==========================================

server.port=${PORT:8080}


# ==========================================
# MYSQL - HIKARICP
# ==========================================

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000


# ==========================================
# HIBERNATE / JPA
# ==========================================

# Evita modificar automaticamente las tablas
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16

spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.generate_statistics=false


# ==========================================
# LOGGING
# ==========================================

logging.level.org.hibernate.SQL=WARN


# ==========================================
# COMPRESION HTTP
# ==========================================

server.compression.enabled=true

server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

server.compression.min-response-size=1024


# ==========================================
# JSON
# ==========================================

spring.jackson.default-property-inclusion=non_null


# ==========================================
# OPENAI
# ==========================================

# La clave real se obtiene desde OPENAI_API_KEY
# Nunca escribir la clave directamente aqui

openai.api.key=${OPENAI_API_KEY:}


# ==========================================
# MCP SERVER
# ==========================================

spring.ai.mcp.server.webmvc.sse-path=/sse


# ==========================================
# FIN CONFIGURACION GENERAL
# ==========================================
