
spring.application.name=registro-usuarios-spring-security

# Utilizar el perfil local por defecto
spring.profiles.default=local

spring.datasource.url =
spring.datasource.username = 
spring.datasource.password = 

# === OPTIMIZACIÓN DE CONEXIONES MySQL ===
# Pool de conexiones HikariCP (configuración optimizada)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

#conexion con la base de datos mongodb
spring.data.mongodb.host=
spring.data.mongodb.port=
spring.data.mongodb.database=


##hibernate Propertiess
#The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

#hibernate ddl auto (create,create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= update

# === OPTIMIZACIÓN DE HIBERNATE ===
# Tamaño de batch para inserciones/actualizaciones masivas
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Reducir consultas N+1 con fetch size
spring.jpa.properties.hibernate.default_batch_fetch_size=16
# Cache de segundo nivel (deshabilitado por defecto, habilitar si es necesario)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
# Generar estadísticas para debug (desactivar en producción)
spring.jpa.properties.hibernate.generate_statistics=false

# === LOGGING (reducido para producción) ===
# Cambiar a WARN o ERROR en producción para mejor rendimiento
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type=WARN

# === COMPRESIÓN DE RESPUESTAS HTTP ===
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# === JACKSON (serialización JSON optimizada) ===
# No incluir campos null en JSON
spring.jackson.default-property-inclusion=non_null


openai.api.key=${OPENAI_API_KEY:}

# MCP Server Config
spring.ai.mcp.server.webmvc.sse-path=/sse