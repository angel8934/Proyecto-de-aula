
# ==========================================
# NUTRI VIDA - CONFIGURACION RAILWAY
# PERFIL: PROD
# ==========================================


# ==========================================
# SERVIDOR RAILWAY
# ==========================================

server.port=${PORT:8080}

server.forward-headers-strategy=framework


# ==========================================
# MYSQL RAILWAY
# ==========================================

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USER}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# MONGODB RAILWAY
# ==========================================

spring.data.mongodb.uri=${MONGODB_URI}

spring.data.mongodb.database=comidas


# ==========================================
# JPA / HIBERNATE
# ==========================================

# No alterar automaticamente las tablas
spring.jpa.hibernate.ddl-auto=validate


# ==========================================
# PREDICTOR PYTHON - FASTAPI
# ==========================================

predictor.api.url=${PREDICTOR_API_URL}


# ==========================================
# OPENAI
# ==========================================

openai.api.key=${OPENAI_API_KEY:}


# ==========================================
# RESEND - VERIFICACION POR CORREO
# ==========================================

# Las variables RESEND_API_KEY,
# RESEND_FROM_EMAIL y APP_PUBLIC_URL
# se leen directamente desde Railway
# por VerificacionEmailServicio.


# ==========================================
# SEGURIDAD DE COOKIES EN HTTPS
# ==========================================

server.servlet.session.cookie.secure=true

server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.same-site=lax


# ==========================================
# OCULTAR ERRORES INTERNOS
# ==========================================

server.error.include-message=never

server.error.include-stacktrace=never

server.error.include-binding-errors=never


# ==========================================
# LOGGING
# ==========================================

logging.level.org.hibernate.SQL=WARN


# ==========================================
# FIN CONFIGURACION RAILWAY
# ==========================================
# ==========================================
# AUTENTICACION BIOMETRICA - PASSKEYS
# ==========================================

passkeys.enabled=${PASSKEY_ENABLED:false}

passkeys.rp-id=${PASSKEY_RP_ID:localhost}

passkeys.android-origin=${PASSKEY_ANDROID_ORIGIN:}